<link rel="stylesheet" href="chatbot/chat-style.css">

    <button id="modern-chat-btn" onclick="toggleChat()" aria-label="Open Chat">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"

        </svg>
    </button>

    <div id="chat-widget-container">
        <div id="chat" class="dark">
            <div class="chat-header">
                <div class="left">
                    <div class="status-dot"></div>
                    Mainul's AI Assistant
                </div>
                <div class="header-controls">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <div class="icon-sun"></div>
                        <div class="icon-moon"></div>
                    </div>
                    <div class="close-chat" onclick="toggleChat()">&times;</div>
                </div>
            </div>

            <div id="messages"></div>

            <div class="input-area">
                <input id="input" type="text" autocomplete="off" placeholder="Ask about my projects or services..." />
                <button id="sendBtn">➤</button>
            </div>
        </div>
    </div>

    <script src="chatbot/chat-logic.js"></script>
